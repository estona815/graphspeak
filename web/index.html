<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<body><a class="skip" href="#lesson-title">Skip to lesson</a><header><a class="brand" href="#">GraphSpeak</a><button id="reset">Reset lesson</button></header>
<div class="shell"><aside><h2>Lessons</h2><nav aria-label="Lessons"><button data-lesson="axis">1. The cropped axis</button><button data-lesson="percent">2. Percent or percentage points?</button><button data-lesson="missing">3. Missing is not zero</button></nav><p>Synthetic data. No account or upload.</p></aside>
